name: Feature request
description: Suggest an improvement to the questionnaire workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Clinical or workflow need
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: textarea
    id: fhir
    attributes:
      label: FHIR / SMART specifics
      description: Resources, operations, launch context or SDC features involved, if you know them.
